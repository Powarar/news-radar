name: Deploy to production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: news-radar-production
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.1
        working-directory: backend
      - run: ruff check .
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:                         
          POSTGRES_USER: newsradar                                                                                                                    
          POSTGRES_PASSWORD: newsradar
          POSTGRES_DB: newsradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
        env:
          SECRET_KEY: secret-key-for-ci
          OAUTH_CODE_TTL: 300
          POSTGRES_PASSWORD: newsradar
          POSTGRES_HOST: localhost
          POSTGRES_USER: newsradar
          POSTGRES_DB: newsradar
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend                                                                                                                    
        env:
          SECRET_KEY: secret-key-for-ci
          OAUTH_CODE_TTL: 300
          POSTGRES_PASSWORD: newsradar
          POSTGRES_HOST: localhost
          POSTGRES_USER: newsradar
          POSTGRES_DB: newsradar
          TEST_DATABASE_URL: postgresql+asyncpg://newsradar:newsradar@localhost:5432/newsradar

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/news-radar
            git fetch origin main
            git merge --ff-only ${{ github.sha }}
            bash scripts/deploy.sh ${{ github.sha }}
