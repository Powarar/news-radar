name: Dev CI Checks

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: news-radar-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.1
        working-directory: backend
      - run: ruff check .
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: newsradar
          POSTGRES_PASSWORD: newsradar
          POSTGRES_DB: newsradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
        env:
          SECRET_KEY: secret-key-for-ci
          OAUTH_CODE_TTL: 300
          POSTGRES_PASSWORD: newsradar
          POSTGRES_HOST: localhost
          POSTGRES_USER: newsradar
          POSTGRES_DB: newsradar
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend
        env:
          SECRET_KEY: secret-key-for-ci
          OAUTH_CODE_TTL: 300
          POSTGRES_PASSWORD: newsradar
          POSTGRES_HOST: localhost
          POSTGRES_USER: newsradar
          POSTGRES_DB: newsradar
          TEST_DATABASE_URL: postgresql+asyncpg://newsradar:newsradar@localhost:5432/newsradar

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend