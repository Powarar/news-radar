x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: news-radar-backend:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  worker:
    image: news-radar-backend:latest
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default,parsing,ai,notifications,preferences --concurrency=4
    env_file: .env.prod
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout=5 2>/dev/null | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    image: news-radar-backend:latest
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env.prod
    depends_on:
      worker:
        condition: service_healthy
    restart: always
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://news.safonovpavel.space/api}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME:-RadrarNewsBot}
    image: news-radar-frontend:latest
    restart: always
    logging: *default-logging

  bot:
    build: ./bot
    image: news-radar-bot:latest
    command: python main.py
    env_file: .env.prod
    depends_on:
      - backend
    restart: always
    logging: *default-logging

  flower:
    image: news-radar-backend:latest
    command: celery -A app.workers.celery_app flower --port=5555
    env_file: .env.prod
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
      - worker
    restart: always
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
